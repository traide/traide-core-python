[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/traide"]

[project]
name = "traide-core-python"
version = "0.1.0"
description = "Traide core Python library"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gcloud-aio-storage~=9.6.4",
    "google-auth==2.56.3", # pin version to match other google cloud libraries
    "google-cloud-logging~=3.16",
    "greenlet~=3.5.2", # required to support async sqlalchemy
    "httpx~=0.28.1",
    "opentelemetry-api==1.42.1", # use specific version to match gcp-trace
    "opentelemetry-exporter-otlp-proto-http==1.42.1", # match gcp-trace; only used locally for jaeger
    "opentelemetry-sdk==1.42.1", # use specific version to match gcp-trace
    "opentelemetry-exporter-prometheus==0.63b1", # use specific version to match gcp-trace
    "opentelemetry-instrumentation-sqlalchemy==0.63b1", # use specific version to match gcp-trace
    "opentelemetry-exporter-gcp-trace==1.12.0", # held: 1.13/1.14 only add a deprecation marker on CloudTraceSpanExporter, which strict pyright rejects -- migrate to the OTLP exporter instead of bumping
    "pgvector~=0.4.2", # held at 0.4.x: 0.5.0 makes SQLAlchemy vector columns return list instead of ndarray, which ai-prediction-service reads directly
    "psycopg[binary]~=3.3.4",
    "pydantic-settings~=2.14.2",
    "redis~=7.4.1", # already the newest 7.x; held below 8 by faststream 0.6.7's redis extra, which caps redis <8.0.0
    "sentry-sdk~=2.66.1",
    "sqlalchemy~=2.0.51",
    "structlog~=26.1",
    "tenacity~=9.1.4",
    "uvicorn~=0.52.1",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pyright",
    "pytest",
    "pre-commit",
]
fastapi = [
    # HELD BACK <0.137 (TRA-1286): fastapi >=0.137 adds a lazy `_IncludedRouter`
    # that opentelemetry-instrumentation-fastapi 0.63b1 crashes on (unguarded
    # route.path on a partial match -> 500 on CORS preflight). The upstream fix
    # is otel 0.64b0, which needs opentelemetry-sdk>=1.43 — but logfire
    # (head_of_customs) caps sdk<1.43. WHEN logfire supports sdk>=1.43: raise
    # fastapi to latest AND bump the otel stack to 0.64b0/1.43, then drop this note.
    "fastapi~=0.136.3",
    "opentelemetry-instrumentation-fastapi==0.63b1", # use specific version to match gcp-trace
    "prometheus-fastapi-instrumentator>=8.0.2",
]
faststream = [
    "faststream[cli,otel,prometheus,redis]>=0.6.7,<0.8.0", # held at 0.6.x: 0.7 removed faststream.redis.parser.JSONMessageFormat, breaking backend_pipeline (see TRA-1286 follow-up)
]

[dependency-groups]
dev = [
    "pre-commit>=4.3.0",
]

[tool.pyright]
typeCheckingMode = "strict"
reportMissingImports = true
reportUnusedImport = true
venvPath = "."
venv = ".venv"

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

# Same as Black.
line-length = 200
indent-width = 4

# Assume Python 3.12
target-version = "py312"

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = ["E4", "E7", "E9", "F", "UP", "I"]
extend-select = ["C4", "SIM"] # "TCH"
ignore = ["E731"]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = false

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"
